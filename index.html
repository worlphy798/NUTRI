<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f0"><title>NUTRI</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#193c2a;background:#f7f7f0}*{box-sizing:border-box}body{margin:0}.app{max-width:550px;margin:auto;padding:24px 17px 100px}h1{font-family:Georgia,serif;font-size:32px;margin:8px 0}h2{font-size:19px;margin:22px 0 12px}small,.muted{color:#758477}.eyebrow{font-size:11px;letter-spacing:1.8px;font-weight:800;color:#71836f}.card{background:white;border-radius:19px;padding:17px;margin:12px 0;box-shadow:0 3px 14px #183a2208}.hero{background:#19432d;color:white}.hero small{color:#d1e8cf}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.number{font-size:28px;font-weight:750}.progress{height:9px;background:#e1e8da;border-radius:10px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#a3d26b;border-radius:10px}button,select,input{font:inherit}button{cursor:pointer;border:0;background:#e9f0e2;color:#1c472d;border-radius:13px;padding:12px;font-weight:650}button.primary{background:#1b492e;color:white;width:100%}button.ghost{background:transparent}input,select{width:100%;padding:11px;border:1px solid #e0e6da;border-radius:11px;background:#fff;color:#193c2a}label{font-size:13px;font-weight:650;display:block;margin:12px 0 5px}.meal,.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #f0f2eb}.meal:last-child,.item:last-child{border:0}.meal .info,.item .info{flex:1}.meal strong,.item strong{display:block}.meal span,.item span{font-size:12px;color:#788778}.emoji{background:#edf3e5;border-radius:12px;padding:12px;font-size:22px}.pill{font-size:12px;border-radius:20px;background:#e7f1d8;padding:6px 10px;color:#335c3b}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fff;border-top:1px solid #e9ede6;padding:9px 4px calc(10px + env(safe-area-inset-bottom))}.navin{display:flex;width:min(550px,100%)}.nav button{flex:1;background:transparent;padding:7px 2px;font-size:11px;color:#768575}.nav button.active{color:#17482d;font-weight:850}.nav button b{display:block;font-size:21px;margin-bottom:3px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.chips{display:flex;gap:7px;overflow-x:auto;padding:5px 0}.chips button{white-space:nowrap}.chips .selected{background:#19432d;color:white}.done{text-decoration:line-through;opacity:.5}.bar{height:12px;background:#e6eee1;border-radius:9px;overflow:hidden}.bar>div{background:#7da851;height:100%}.hint{font-size:12px;line-height:1.5;color:#728272}.toast{background:#e8f4dc;border-radius:12px;padding:12px;margin:10px 0;color:#31523c}.danger{color:#a34e43}.scroll{max-height:48vh;overflow:auto}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week button{padding:9px 1px;font-size:12px}.week button.selected{background:#1d482e;color:white}.inline{display:flex;gap:8px}.inline input{flex:1;min-width:0}input[type=checkbox]{width:20px;height:20px;accent-color:#225a38}input[type=number]{max-width:120px}.tiny{font-size:11px}.section-title{font-family:Georgia,serif;font-size:24px}.toggle{display:flex;gap:6px;margin:12px 0}.toggle button{flex:1}.toggle button.selected{background:#204b31;color:white}</style></head><body><main class="app" id="root"></main><nav class="nav"><div class="navin" id="nav"></div></nav><script>
const mealNames=['Colazione','Spuntino mattina','Pranzo','Merenda','Cena'];const emojis=['☕','🍎','🥗','🥜','🍽️'];
const C=(str)=>str.split('|').map(x=>{let a=x.trim().match(/^(.*?)(?:\s+(\d+(?:[.,]\d+)?\s*(?:g|cucchiai|gallette)))?(?:\s*\(max\s*(\d+)\s*volt[ae]\/settimana\))?$/i);return {name:(a?.[1]||x).trim(),qty:a?.[2]||'',max:a?.[3]?+a[3]:0}});
const catalog=[[
 ['Bevanda',C('Caffè|Tè|Latte')],['Carboidrato',C('Pane di segale 50 g|Pane 40 g|Fette biscottate 30 g|Fette biscottate integrali 30 g|Fiocchi di avena 30 g|Buoni Così Galbusera 30 g|Gran Cereale 20 g|Oro Saiwa 25 g|Osvego Gentilini 20 g|Privolat Misura 20 g|Cornflakes 30 g (max 2 volte/settimana)|Muesli 30 g (max 2 volte/settimana)|Riso soffiato 30 g (max 2 volte/settimana)')],['Proteina',C("Yogurt greco 150 g|Ricotta vaccina 50 g (max 2 volte/settimana)|Burro d'arachidi 20 g (max 3 volte/settimana)|Philadelphia Protein 40 g")],['Dolcificante',C('Miele 10 g|Marmellata 10 g|Cacao amaro 10 g')]],
 [['Opzione',C('Frutta fresca 150 g + frutta secca 5 g|Triangolini di legumi 20 g + frutta secca 5 g|Cioccolato fondente 10 g + frutta secca 5 g|2 gallette + cioccolato fondente + frutta secca 5 g|Barretta cereali 30 g (max 2 volte/settimana)')]],
 [['Carboidrato',C("Pasta 90 g|Riso 90 g|Gnocchi cotti 210 g|Gnocchi crudi 190 g|Farro 90 g|Grano saraceno 100 g|Quinoa 80 g|Legumi secchi 90 g|Pasta all'uovo fresca 100 g|Pasta all'uovo secca 80 g|Misto legumi secchi 90 g|Legumi freschi 300 g|Legumi in scatola 300 g|Piselli 300 g|Fagioli borlotti 300 g|Fagioli cannellini 300 g|Pane integrale 140 g|Pane di segale 140 g|Pane 110 g|Patate 140 g")],['Proteina',C('Petto di pollo 120 g|Tacchino 110 g|Bovino magro 110 g|Manzo magro 90 g|Salmone affumicato 80 g|Tonno sott’olio sgocciolato 60 g|Merluzzo 160 g|Insalata di mare 130 g|Prosciutto crudo magro 80 g (max 2 volte/settimana)|Prosciutto cotto magro 90 g (max 2 volte/settimana)|Bresaola 80 g (max 2 volte/settimana)|Uova 120 g|Mozzarella 50 g (max 1 volta/settimana)|Ricotta vaccina 80 g (max 1 volta/settimana)|Parmigiano 30 g (max 2 volte/settimana)|Iocca 100 g|Feta 50 g (max 1 volta/settimana)')],['Verdure',C('Verdure ricche di fibre 150 g')],['Grassi',C('Olio EVO 2 cucchiai|Avocado 50 g')]],
 [['Gruppo 1',C('Frutta fresca 150 g|Mandorle 10 g|Noci 10 g|Nocciole 10 g|Gallette di mais 20 g|Gallette di riso 20 g|Pane di segale 40 g|Pane 40 g')],['Gruppo 2',C('Frutta fresca 150 g|Mandorle 10 g|Noci 10 g|Nocciole 10 g|Prosciutto cotto magro 40 g (max 1 volta/settimana)|Prosciutto crudo magro 40 g (max 1 volta/settimana)|Bresaola 40 g (max 1 volta/settimana)|Tacchino al forno 50 g (max 1 volta/settimana)|Yogurt greco 120 g (max 2 volte/settimana)|Yogurt magro 120 g')]],
 [['Proteina',C('Petto di pollo 120 g|Tacchino 110 g|Filetto di vitello 110 g|Coscio di maiale magro 110 g|Bovino magro 110 g|Manzo magro 90 g|Merluzzo 160 g|Sogliola 140 g|Spigola 150 g|Salmone fresco 60 g|Salmone affumicato 80 g|Gamberi 170 g|Polpo 210 g|Seppie 170 g|Insalata di mare 130 g|Orata 100 g|Platessa 150 g|Tonno fresco 80 g|Tonno sott’olio sgocciolato 60 g|Uova 70 g')],['Verdure',C('Verdure ricche di fibre 150 g')],['Grassi',C('Olio EVO 2 cucchiai|Avocado 50 g')]]];
let state;try{state=JSON.parse(localStorage.getItem('nutri_v1'))||{}}catch{state={}};state.days||={};state.shopping||={};state.weights||=[];let tab='oggi',date=localDate(),editing=null,planning=false,shoppingCategory=0;function localDate(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function plusDate(d,n){let a=new Date(d+'T12:00:00');a.setDate(a.getDate()+n);return localDate(a)}function day(d=date){return state.days[d]||(state.days[d]={meals:{},water:0,steps:0,workout:false})}function save(){localStorage.setItem('nutri_v1',JSON.stringify(state))}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function nameDate(d){return new Date(d+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}function count(d){return Object.values(day(d).meals).filter(x=>x.done).length}function meal(d,i){return day(d).meals[i]||{selected:{},done:false}}function selections(d,i){return Object.entries(meal(d,i).selected||{}).map(([g,idx])=>catalog[i][+g][1][idx]).filter(Boolean)}function weekStart(d){let a=new Date(d+'T12:00:00');a.setDate(a.getDate()-(a.getDay()+6)%7);return localDate(a)}function usage(name,d,exceptI){let start=weekStart(d),sum=0;for(let k=0;k<7;k++){let x=plusDate(start,k);for(let i=0;i<5;i++){if(x===d&&i===exceptI)continue;sum+=selections(x,i).filter(o=>o.name===name).length}}return sum}function updateDay(field,v){day()[field]=v;save();render()}function go(t){tab=t;editing=null;render()}function setDate(d){date=d;editing=null;render()}function choose(i,g,idx){let m=meal(date,i);let sel={...m.selected,[g]:+idx};let opt=catalog[i][g][1][idx];if(opt.max&&usage(opt.name,date,i)>=opt.max&&!Object.values(m.selected||{}).some((old,og)=>catalog[i][+og][1][old]?.name===opt.name)){if(!confirm('Hai raggiunto il limite settimanale indicato per '+opt.name+'. Vuoi selezionarlo comunque?'))return}day().meals[i]={selected:sel,done:false};save();render()}function complete(i){let m=meal(date,i);if(!m.done&&Object.keys(m.selected||{}).length!==catalog[i].length){alert('Seleziona prima un alimento per ogni gruppo.');return}day().meals[i]={...m,done:!m.done};save();render()}function nav(){document.getElementById('nav').innerHTML=[['oggi','⌂','Oggi'],['piano','▦','Pianifica'],['storico','◷','Storico'],['spesa','♧','Spesa'],['altro','☷','Altro']].map(([t,ic,n])=>`<button class="${tab===t?'active':''}" onclick="go('${t}')"><b>${ic}</b>${n}</button>`).join('')}
function render(){nav();let html='';if(editing!==null){let i=editing,m=meal(date,i);html=`<button class="ghost" onclick="editing=null;render()">← Indietro</button><div class="eyebrow">${esc(nameDate(date))}</div><h1>${mealNames[i]}</h1><p class="muted">Scegli un'opzione per ogni gruppo alimentare.</p>`+catalog[i].map(([group,opts],g)=>`<div class="card"><h2>${esc(group)}</h2>${opts.map((o,j)=>`<div class="item" onclick="choose(${i},${g},${j})" style="cursor:pointer"><div class="info"><strong>${esc(o.name)}</strong><span>${esc(o.qty)} ${o.max?' · max '+o.max+'/settimana':''}</span></div><span>${m.selected?.[g]===j?'🟢':'◯'}</span></div>`).join('')}</div>`).join('')+`<div class="card"><h2>Riepilogo</h2>${selections(date,i).map(o=>`<div class="item"><div class="info">${esc(o.name)} <span>${esc(o.qty)}</span></div></div>`).join('')}<button class="primary" onclick="complete(${i})">${m.done?'Segna come non consumato':'Conferma pasto consumato'}</button></div>`;document.getElementById('root').innerHTML=html;return}
if(tab==='oggi'){let d=day(),done=count(date);html=`<div class="eyebrow">NUTRI · IL TUO PERCORSO</div><h1>Buongiorno. 🌿</h1><p class="muted">Un pasto alla volta, verso il tuo obiettivo.</p><div class="card hero"><small>IL TUO OBIETTIVO</small><div class="number">95 kg</div><small>Peso iniziale 104 kg · registra il peso nei progressi</small></div><div class="row"><h2>Obiettivi di oggi</h2><button onclick="go('altro')">Progressi ↗</button></div><div class="grid"><div class="card"><div>💧 Acqua</div><div class="number">${(d.water/1000).toFixed(2).replace('.',',')} L</div><small>Obiettivo 2–2,5 L</small><div class="progress"><div style="width:${Math.min(100,d.water/2500*100)}%"></div></div><div class="inline"><button onclick="updateDay('water',${d.water+250})">+250 ml</button><button onclick="updateDay('water',Math.max(0,${d.water}-250))">−</button></div></div><div class="card"><div>👟 Passi</div><div class="number">${d.steps.toLocaleString('it-IT')}</div><small>Obiettivo 10.000</small><div class="progress"><div style="width:${Math.min(100,d.steps/10000*100)}%"></div></div><button onclick="let v=prompt('Passi di oggi',${d.steps});if(v!==null&&!isNaN(+v))updateDay('steps',Math.max(0,+v))">Modifica</button></div><div class="card"><div>🏋️ Allenamento</div><div class="number">${d.workout?'✓':'—'}</div><small>5 volte a settimana</small><p><button onclick="updateDay('workout',${!d.workout})">${d.workout?'Completato ✓':'Segna fatto'}</button></p></div><div class="card"><div>🥗 Piano alimentare</div><div class="number">${done}/5</div><small>Pasti completati</small><div class="progress"><div style="width:${done*20}%"></div></div></div></div><div class="row"><h2>I tuoi pasti</h2><span class="pill">${done} di 5</span></div>${mealNames.map((n,i)=>`<div class="card meal" onclick="editing=${i};render()" style="cursor:pointer"><div class="emoji">${emojis[i]}</div><div class="info"><strong>${n}</strong><span>${selections(date,i).map(o=>o.name).join(', ')||'Componi il tuo pasto'}</span></div><b>${meal(date,i).done?'✅':'›'}</b></div>`).join('')}<p class="hint">I dati restano salvati in questo browser. I passi vanno inseriti manualmente: Apple Salute non è accessibile direttamente dalla web app.</p>`}
if(tab==='piano'){html=`<div class="eyebrow">ORGANIZZA LA SETTIMANA</div><h1>Pianificazione.</h1><div class="row"><button onclick="setDate(plusDate('${date}',-7))">←</button><strong>${nameDate(weekStart(date))}</strong><button onclick="setDate(plusDate('${date}',7))">→</button></div><div class="week">${Array.from({length:7},(_,i)=>{let d=plusDate(weekStart(date),i);return `<button class="${d===date?'selected':''}" onclick="setDate('${d}')">${['L','M','M','G','V','S','D'][i]}<br>${d.slice(-2)}</button>`}).join('')}</div><h2>${nameDate(date)}</h2>${mealNames.map((n,i)=>`<div class="card meal" onclick="editing=${i};render()" style="cursor:pointer"><div class="emoji">${emojis[i]}</div><div class="info"><strong>${n}</strong><span>${selections(date,i).map(o=>o.name+' '+o.qty).join(' · ')||'Da pianificare'}</span></div><b>${meal(date,i).done?'✓':'›'}</b></div>`).join('')}<button class="primary" onclick="copyDay()">Copia questa giornata a domani</button><p class="hint">Puoi modificare i pasti ogni giorno. Pianificare non equivale a segnare il pasto come consumato.</p>`}
if(tab==='storico'){let days=Array.from({length:28},(_,i)=>plusDate(localDate(),-27+i));html=`<div class="eyebrow">IL TUO PERCORSO</div><h1>Storico.</h1><div class="card"><h2>Ultimi 28 giorni</h2><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:7px">${days.map(d=>`<button onclick="setDate('${d}');go('piano')" style="background:${count(d)===5?'#a4d477':count(d)?'#e2efcf':'#f1f2ee'}">${d.slice(-2)}<br><small>${count(d)}/5</small></button>`).join('')}</div></div><h2>Riepilogo degli ultimi 7 giorni</h2><div class="grid"><div class="card"><small>Pasti completati</small><div class="number">${Array.from({length:7},(_,i)=>count(plusDate(localDate(),-i))).reduce((a,b)=>a+b,0)}/35</div></div><div class="card"><small>Allenamenti</small><div class="number">${Array.from({length:7},(_,i)=>day(plusDate(localDate(),-i)).workout?1:0).reduce((a,b)=>a+b,0)}/5</div></div></div><p class="hint">Le statistiche misurano ciò che registri, non una valutazione nutrizionale dei pasti.</p>`}
if(tab==='spesa'){let cats=['Colazione','Spuntino / Merenda','Pranzo / Cena'];html=`<div class="eyebrow">ORGANIZZAZIONE</div><h1>Lista della spesa.</h1><p class="muted">Tre categorie, con spunte e quantità libere.</p><button class="primary" onclick="suggest()">+ Suggerisci dai pasti dei prossimi 7 giorni</button>${cats.map((c,ci)=>`<div class="card"><h2>${['☕','🍎','🥗'][ci]} ${c}</h2>${Object.entries(state.shopping).filter(([id,v])=>v.cat===ci).map(([id,v])=>`<div class="item"><input type="checkbox" ${v.done?'checked':''} onchange="state.shopping['${id}'].done=this.checked;save();render()"><div class="info ${v.done?'done':''}"><strong>${esc(v.name)}</strong><span>${esc(v.qty||'')}</span></div><button class="ghost danger" onclick="delete state.shopping['${id}'];save();render()">✕</button></div>`).join('')}<div class="inline"><input id="shop${ci}" placeholder="Nuovo alimento e quantità"><button onclick="addShop(${ci})">+</button></div></div>`).join('')}`}
if(tab==='altro'){let recent=state.weights.at(-1);html=`<div class="eyebrow">NUTRI</div><h1>Progressi e dati.</h1><div class="card"><h2>⚖️ Peso</h2><p class="muted">Partenza 104 kg · obiettivo 95 kg</p><div class="number">${recent?esc(recent.value)+' kg':'—'}</div><div class="inline"><input id="weight" type="number" min="20" max="350" step="0.1" placeholder="Peso in kg"><button onclick="addWeight()">Registra</button></div>${state.weights.slice(-5).reverse().map(x=>`<p class="tiny">${x.date}: ${esc(x.value)} kg</p>`).join('')}</div><div class="card"><h2>💾 Backup</h2><p class="hint">I dati sono salvati solo su questo dispositivo/browser. Esporta periodicamente un backup per non perderli.</p><button onclick="backup()">Esporta backup JSON</button><label>Ripristina backup</label><input type="file" accept="application/json" onchange="restore(this)"></div><div class="card"><h2>Apple Salute</h2><p class="hint">Per sincronizzare automaticamente i passi serve una futura versione nativa iOS con HealthKit. Questa versione usa l'inserimento manuale.</p></div><div class="card"><h2>Indicazioni</h2><p class="hint">Le grammature provengono dalla guida fornita. I limiti settimanali sono verificati per singolo alimento, non per categorie equivalenti. Obiettivi di proteine e variazioni del piano vanno confermati con la nutrizionista.</p></div>`}
document.getElementById('root').innerHTML=html}
function copyDay(){let next=plusDate(date,1);if(day(next).meals&&Object.keys(day(next).meals).length&&!confirm('Sovrascrivere i pasti già pianificati domani?'))return;day(next).meals=JSON.parse(JSON.stringify(day(date).meals));Object.values(day(next).meals).forEach(m=>m.done=false);save();setDate(next)}function addShop(ci){let el=document.getElementById('shop'+ci),name=el.value.trim();if(!name)return;state.shopping['i'+Date.now()+Math.random().toString(36).slice(2)]={cat:ci,name,qty:'',done:false};save();render()}function suggest(){let added=0;for(let k=0;k<7;k++){let d=plusDate(localDate(),k);for(let i=0;i<5;i++)for(let o of selections(d,i)){let cat=i===0?0:i===1||i===3?1:2;if(Object.values(state.shopping).some(x=>x.cat===cat&&x.name===o.name))continue;state.shopping['i'+Date.now()+Math.random().toString(36).slice(2)]={cat,name:o.name,qty:o.qty,done:false};added++}}save();render();alert(added+' alimenti aggiunti. Verifica le quantità: non sono ancora aggregate tra più pasti.')}function addWeight(){let v=+document.getElementById('weight').value;if(!v||v<20||v>350)return alert('Inserisci un peso valido');state.weights.push({date:localDate(),value:v});save();render()}function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nutri-backup-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function restore(el){let f=el.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x.days||!x.shopping)throw Error();if(confirm('Sostituire i dati correnti con il backup?')){state=x;state.weights||=[];save();render()}}catch{alert('Backup non valido')}}render();
</script></body></html>
